<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vacation Planner</title>
  <meta name="description" content="Plan vacations by cost and track real spending in ₪.">
  <meta name="theme-color" content="#0e7c86">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="update-banner" class="update-banner" hidden>
    <span>Update available — refresh?</span>
    <button class="btn sm primary" data-u="reload">Refresh</button>
    <button class="btn sm ghost" data-u="later">Later</button>
  </div>
  <div id="app"><div class="loading">Loading…</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
